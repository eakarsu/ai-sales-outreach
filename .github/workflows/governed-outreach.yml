name: governed-outreach

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: outreach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d outreach_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/outreach_test
      JWT_SECRET: ci-access-secret-that-is-at-least-thirty-two-characters
      DEFAULT_TENANT_ID: tenant-ci
      CLIENT_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_governed_outreach.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_governed_outreach.sql
      - run: npm run check
        working-directory: backend
      - run: npm run build
        working-directory: frontend
      - run: bash -n start.sh
      - run: >-
          ! grep -E 'kill -9|pkill|npm install|createdb|npm run seed' start.sh
